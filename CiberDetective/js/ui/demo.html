<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CiberDetective · Banco de pruebas de la interfaz</title>
  <link rel="stylesheet" href="../../css/estilo.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d14; }
    /* Fondo que simula la ciudad 3D detrás de la interfaz */
    #mundo { position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(255,170,90,.35), transparent 50%),
        radial-gradient(ellipse at 70% 70%, rgba(0,120,160,.35), transparent 55%),
        repeating-linear-gradient(45deg, #1f2a22 0 40px, #233026 40px 80px); }
    #interfaz { position: fixed; inset: 0; pointer-events: none; }
    #panel-demo { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); z-index: 1000;
      display: flex; flex-direction: column; gap: 4px; font: 600 13px system-ui, sans-serif; }
    #panel-demo button { padding: 5px 10px; cursor: pointer; text-align: left; }
  </style>
</head>
<body>
  <!-- Abrir con un servidor estático desde la carpeta CiberDetective: py -m http.server 8130
       y visitar http://localhost:8130/js/ui/demo.html -->
  <div id="mundo"></div>
  <div id="interfaz"></div>
  <div id="panel-demo" hidden>
    <button data-p="investigacion">Investigación (caso 1)</button>
    <button data-p="investigacion2">Investigación (caso al azar)</button>
    <button data-p="escudo">Escudo táctico</button>
    <button data-p="lab">Laboratorio</button>
    <button data-p="era">Avanzar de era</button>
    <button data-p="toast">Notificaciones</button>
    <button data-p="detective">Seleccionar detective</button>
    <button data-p="edificio">Seleccionar edificio</button>
    <button data-p="nada">Deseleccionar</button>
    <button data-p="victoria">Final: victoria</button>
    <button data-p="derrota">Final: derrota</button>
  </div>
  <script type="module">
    import * as datos from '../datos/datos.js';
    import { crearInterfaz } from './interfaz.js';

    const ui = crearInterfaz({ raiz: document.getElementById('interfaz'), datos });
    const r = { ...datos.RECURSOS_INICIALES };
    const tecnologias = new Set(['lupa-enlaces']);
    let t = 0, pausado = false;

    ['accion', 'minimapa', 'caso', 'pausa'].forEach(ev => ui.al(ev, d => {
      console.log('[demo] evento', ev, d);
      if (ev === 'pausa') pausado = d.pausado;
      if (ev === 'accion') ui.notificar({ titulo: 'Acción', texto: d.id, tipo: 'info' });
    }));

    // Datos falsos de minimapa: una cuadrícula de calles, edificios y una bahía.
    const mm = { limites: { minX: -120, maxX: 120, minZ: -120, maxZ: 120 }, calles: [], edificios: [], agua: [[[60, -120], [120, -120], [120, 120], [90, 120], [70, 20]]] };
    for (let i = -100; i <= 60; i += 40) { mm.calles.push([[i, -110], [i, 110]]); mm.calles.push([[-110, i], [60, i]]); }
    const ids = ['central', 'laboratorio', 'banco', 'colegio', 'cibercafe', 'cafe-malecon', 'tecnostore', 'alcaldia', 'puerto', 'casa-1', 'casa-2', 'casa-3'];
    const tipos = ['central', 'laboratorio', 'banco', 'colegio', 'cibercafe', 'cafe', 'tienda', 'alcaldia', 'puerto', 'casa', 'casa', 'casa'];
    ids.forEach((id, k) => mm.edificios.push({ id, tipo: tipos[k], x: -80 + (k % 4) * 40, z: -80 + Math.floor(k / 4) * 40, w: 14, d: 12 }));
    for (let k = 0; k < 40; k++) mm.edificios.push({ x: -100 + (k * 37) % 160, z: -100 + (k * 53) % 200, w: 6, d: 6, tipo: 'casa' });

    async function arrancar() {
      for (let p = 0; p <= 1.0001; p += 0.1) { ui.pantallaCarga(p, p < .5 ? 'Levantando la ciudad…' : 'Encendiendo farolas…'); await new Promise(z => setTimeout(z, 250)); }
      ui.ocultarCarga();
      await ui.menuPrincipal();
      await ui.intro(datos.INTRO);
      ui.recursos(r); ui.era(datos.ERAS[0]); document.getElementById('panel-demo').hidden = false;
      let prox = 3;
      const activos = new Map();
      setInterval(() => {
        if (pausado) return;
        t++; r.energia = Math.min(r.energiaMax, r.energia + .1); r.presupuesto += .2;
        ui.reloj(t); ui.recursos(r);
        if (--prox <= 0 && activos.size < 3) {
          const c = datos.CASOS.find(c => !activos.has(c.id));
          if (c) { activos.set(c.id, { c, plazo: c.plazo }); ui.notificar({ titulo: `Nuevo incidente: ${c.titulo}`, texto: c.resumen, tipo: 'alerta', accion: { etiqueta: 'Ver', fn: () => console.log('ver', c.id) } }); }
          prox = 15;
        }
        activos.forEach(a => a.plazo--);
        ui.casosActivos([...activos.values()].map(a => ({ id: a.c.id, titulo: a.c.titulo, edificio: a.c.edificio, urgencia: a.c.urgencia, tiempoRestante: Math.max(0, a.plazo) })));
      }, 1000);
      let ang = 0;
      (function frame() {
        ang += .004;
        const cx = Math.cos(ang) * 50, cz = Math.sin(ang) * 50;
        ui.minimapa(mm, { vista: [[cx - 30, cz - 20], [cx + 30, cz - 20], [cx + 40, cz + 25], [cx - 40, cz + 25]], alertas: ['banco', 'colegio'], detective: { x: cx * .6, z: cz * .6 }, seguros: ['casa-1'] });
        requestAnimationFrame(frame);
      })();
      seleccionarDetective();
    }

    function seleccionarDetective() {
      const d = datos.DETECTIVE;
      ui.seleccion({ tipo: 'detective', id: 'detective', nombre: d.nombre, subtitulo: d.rango, retrato: d.retrato,
        descripcion: 'Lista para recibir órdenes. Clic derecho sobre un edificio con alerta para investigar.', estado: '2 incidente(s) activo(s)',
        acciones: [
          { id: 'investigar:banco-cuentas-vaciadas', etiqueta: 'Investigar: Cuentas vaciadas', icono: '🔍', atajo: '1', tooltip: 'Banco del Puerto · cuentas vaciadas' },
          { id: 'investigar:chatverde-robado', etiqueta: 'Investigar: ChatVerde robado', icono: '🔍', atajo: '2', tooltip: 'Prueba de deshabilitado', deshabilitado: true },
          { id: 'volver-central', etiqueta: 'Volver a la Central', icono: '🏛️', atajo: 'H', tooltip: 'Regresa a la base' }] });
    }

    const ctxInv = () => ({ energia: () => r.energia, gastarEnergia: n => { if (r.energia < n) return false; r.energia -= n; ui.recursos(r); return true; }, tecnologias });
    const P = {
      async investigacion() { const res = await ui.investigacion(datos.CASOS[0], ctxInv()); console.log('[demo] resultado', res); if (res.resuelto) await ui.escudoTactico(datos.CASOS[0], res); },
      async investigacion2() { const c = datos.CASOS[Math.floor(Math.random() * datos.CASOS.length)]; const res = await ui.investigacion(c, ctxInv()); console.log('[demo] resultado', res); if (res.resuelto) await ui.escudoTactico(c, res); },
      escudo: () => ui.escudoTactico(datos.CASOS[1], { resuelto: true, aciertos: 3, total: 3 }),
      async lab() { console.log('[demo] laboratorio →', await ui.laboratorio(datos.TECNOLOGIAS, { investigadas: tecnologias, puedePagar: c => Object.entries(c).every(([k, v]) => (r[k] ?? 0) >= v), eraActual: 2 })); },
      async era() { console.log('[demo] era →', await ui.avanzarEra(datos.ERAS[1], { casosResueltos: 2, puedePagar: r.presupuesto >= 120 && r.evidencia >= 20 })); },
      toast() { ['info', 'exito', 'alerta', 'error'].forEach((tipo, i) => setTimeout(() => ui.notificar({ titulo: `Notificación ${tipo}`, texto: 'Texto de prueba de la notificación.', tipo }), i * 300)); },
      detective: seleccionarDetective,
      edificio: () => ui.seleccion({ tipo: 'edificio', id: 'central', nombre: 'Central de Ciberpolicía', subtitulo: 'Centro de mando', retrato: '🏛️', descripcion: 'Sin incidentes reportados.', estado: '',
        acciones: [{ id: 'avanzar-era', etiqueta: 'Avanzar a APLICA', icono: '⏫', atajo: 'E', costo: datos.ERAS[1].requisito, tooltip: datos.ERAS[1].descripcion }] }),
      nada: () => ui.seleccion(null),
      victoria: () => ui.final({ victoria: true, casos: 11, total: 11, tiempo: 2710, precision: 87, analizadas: 34, tecnologias: 9, era: 4, confianza: 82 }),
      derrota: () => ui.final({ victoria: false, casos: 3, total: 11, tiempo: 900, precision: 54, analizadas: 12, tecnologias: 2, era: 2, confianza: 0 })
    };
    document.getElementById('panel-demo').addEventListener('click', e => { const p = e.target.dataset.p; if (p) P[p](); });
    arrancar();
  </script>
</body>
</html>
