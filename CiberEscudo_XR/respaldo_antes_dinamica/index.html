<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050810">
  <title>CiberEscudo XR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Orbitron'; src: url('fuentes/Orbitron.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: 'Rajdhani'; src: url('fuentes/Rajdhani-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Rajdhani'; src: url('fuentes/Rajdhani-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }

    :root { --naranja: #ff9d00; --dorado: #ffcc33; --cian: #00f7ff; --verde: #00ffaa; --fondo: #050810; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); }
    a-scene canvas { cursor: crosshair !important; }

    #menu {
      position: fixed; inset: 0; z-index: 20; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px 16px; box-sizing: border-box; text-align: center;
      font-family: Rajdhani, 'Segoe UI', sans-serif; color: #fff;
      background:
        repeating-linear-gradient(0deg, rgba(0, 247, 255, 0.04) 0 1px, transparent 1px 6px),
        radial-gradient(ellipse at center, #0c1830 0%, #050810 70%);
    }
    #menu .marco {
      position: relative; max-width: 640px; width: 100%; padding: 32px 24px; box-sizing: border-box;
      border: 1px solid rgba(255, 157, 0, 0.4); border-radius: 18px; background: rgba(5, 10, 22, 0.75);
      box-shadow: 0 0 40px rgba(255, 157, 0, 0.15), inset 0 0 30px rgba(0, 247, 255, 0.05);
    }
    #menu .marco::before, #menu .marco::after {
      content: ''; position: absolute; width: 46px; height: 46px; border: 4px solid var(--naranja);
      filter: drop-shadow(0 0 8px var(--naranja));
    }
    #menu .marco::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 18px 0 0 0; }
    #menu .marco::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 18px 0; }
    #menu .escudo { font-size: 56px; filter: drop-shadow(0 0 16px var(--cian)); }
    #menu h1 {
      margin: 6px 0 4px; font-family: Orbitron, sans-serif; font-weight: 900; letter-spacing: 2px;
      font-size: clamp(28px, 7vw, 52px); color: var(--naranja); text-shadow: 0 0 18px rgba(255, 157, 0, 0.7);
    }
    #menu .lema { margin: 0 0 22px; font-size: clamp(17px, 3.6vw, 22px); color: #cfe6ff; font-weight: 600; }
    #menu .botones { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
    #menu button {
      font: 700 20px Orbitron, sans-serif; letter-spacing: 1px; color: #fff; cursor: pointer;
      background: rgba(10, 18, 34, 0.9); border: 2px solid var(--naranja); border-radius: 12px;
      padding: 16px 20px; box-shadow: 0 0 16px rgba(255, 157, 0, 0.3); transition: transform 0.1s, box-shadow 0.2s;
    }
    #menu button small { display: block; margin-top: 4px; font: 600 15px Rajdhani, sans-serif; color: #b9c8da; letter-spacing: 0; }
    #menu button:hover, #menu button:focus-visible { box-shadow: 0 0 28px var(--naranja); transform: scale(1.02); outline: none; }
    #menu button.principal { border-color: var(--verde); box-shadow: 0 0 20px rgba(0, 255, 170, 0.35); font-size: 22px; }
    #menu button.principal:hover { box-shadow: 0 0 32px var(--verde); }
    #menu button.secundario { border-color: var(--cian); box-shadow: 0 0 14px rgba(0, 247, 255, 0.25); }
    #menu .pie { margin-top: 18px; font-size: 15px; color: #8aa0b8; line-height: 1.5; }
    #menu .estado { font-weight: 700; color: var(--verde); }
    #menu .estado.pendiente { color: var(--dorado); }
    #menu .reset {
      margin-top: 8px; background: none; border: none; box-shadow: none; padding: 4px;
      font: 600 14px Rajdhani, sans-serif; color: #6f8399; text-decoration: underline; letter-spacing: 0;
    }
    #menu .reset:hover { box-shadow: none; transform: none; color: #fff; }
    #aviso { min-height: 20px; color: var(--dorado); font-weight: 700; }
    .oculto { display: none !important; }
  </style>

  <script src="vendor/aframe-v1.6.0.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/juego.js"></script>
</head>
<body>

  <div id="menu">
    <div class="marco">
      <div class="escudo">🛡️</div>
      <h1>CIBERESCUDO XR</h1>
      <p class="lema">Tu salón fue hackeado. Bloquea las estafas y protege a tu amigo del ciberacoso.</p>
      <div class="botones">
        <button id="btn-ar" class="principal">▶ REALIDAD MIXTA<small>Las amenazas salen de las paredes reales (recomendado)</small></button>
        <button id="btn-vr">MODO VR<small>Mundo virtual completo</small></button>
        <button id="btn-pantalla" class="secundario">PROBAR EN PANTALLA<small>Sin casco: clic para disparar, arrastra para mirar</small></button>
      </div>
      <p id="aviso"></p>
      <p class="pie">
        Mandos: <b>gatillo</b> = disparar · apunta unos segundos = <b>escanear</b><br>
        <span id="estado-offline" class="estado pendiente">Preparando modo sin conexión…</span>
      </p>
      <button id="btn-reset" class="reset">Reiniciar ranking</button>
    </div>
  </div>

  <a-scene juego
           webxr="requiredFeatures: local-floor; optionalFeatures: plane-detection"
           xr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false"
           renderer="antialias: true; foveationLevel: 1">

    <a-entity light="type: ambient; intensity: 0.9; color: #8899bb"></a-entity>
    <a-entity light="type: directional; intensity: 1.4; color: #ffffff" position="1 3 2"></a-entity>

    <!-- Entorno virtual: se oculta en realidad mixta para ver el salón real -->
    <a-sky color="#03060d" hide-on-enter-ar></a-sky>
    <a-entity id="entorno" hide-on-enter-ar></a-entity>

    <a-entity id="rig">
      <a-camera id="camara" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false"></a-camera>
      <!-- Manos en primera persona: se muestran al conectar cada mando (ver juego.js) -->
      <a-entity id="mano-izq" laser-controls="hand: left; model: false"
                gltf-model="url(modelos/mano_izquierda.glb)" visible="false"
                raycaster="objects: .disparable; far: 25; lineColor: #00f7ff; lineOpacity: 0.55"></a-entity>
      <a-entity id="mano-der" laser-controls="hand: right; model: false"
                gltf-model="url(modelos/mano_derecha.glb)" visible="false"
                raycaster="objects: .disparable; far: 25; lineColor: #ff9d00; lineOpacity: 0.55"></a-entity>
    </a-entity>

    <!-- Aquí el juego agrega los objetos que se pueden disparar -->
    <a-entity id="contenedor"></a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector('a-scene');
    const aviso = document.getElementById('aviso');

    function iniciar(modo) {
      aviso.textContent = '';
      const juego = escena.components.juego;
      if (!juego) return;
      if (modo === 'pantalla') { juego.activar('pantalla'); return; }

      // El clic del menú es el gesto que el navegador exige para abrir la sesión XR
      juego.activar(modo);
      let promesa;
      try {
        promesa = modo === 'ar' ? escena.enterAR() : escena.enterVR();
      } catch (err) {
        promesa = Promise.reject(err);
      }
      Promise.resolve(promesa).catch(err => {
        console.warn('No se pudo entrar en XR:', err);
        juego.volverAlMenu();
        aviso.textContent = modo === 'ar'
          ? 'Este dispositivo no permite realidad mixta aquí. Usa el Meta Quest o prueba en pantalla.'
          : 'Este dispositivo no permite VR aquí. Usa el Meta Quest o prueba en pantalla.';
      });
    }

    document.getElementById('btn-ar').addEventListener('click', () => iniciar('ar'));
    document.getElementById('btn-vr').addEventListener('click', () => iniciar('vr'));
    document.getElementById('btn-pantalla').addEventListener('click', () => iniciar('pantalla'));
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('¿Borrar el ranking y reiniciar la numeración de agentes?')) return;
      try { localStorage.removeItem('ciberescudo_ranking'); localStorage.removeItem('ciberescudo_agentes'); } catch (e) {}
      aviso.textContent = 'Ranking reiniciado.';
    });

    // Modo sin conexión: el service worker guarda todos los archivos en el casco
    const estado = document.getElementById('estado-offline');
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
        estado.textContent = '✔ Listo para usar sin conexión';
        estado.classList.remove('pendiente');
      }).catch(() => { estado.textContent = 'Modo sin conexión no disponible'; });
    } else {
      estado.textContent = 'Abre desde https:// o localhost para activar el modo sin conexión';
    }
  </script>
</body>
</html>
